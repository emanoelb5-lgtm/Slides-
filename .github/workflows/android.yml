name: Android build and projector checks

on:
  push:
    branches: [main]
    paths-ignore: ['distribution/**', '**.md', 'signing/**']
  pull_request:
    paths-ignore: ['distribution/**', '**.md', 'signing/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint and unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease assembleDebug assembleDebugAndroidTest
          python3 tools/apk_payload.py app/build/outputs/apk/release/app-release-unsigned.apk > app/build/payload-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: slide-release-unsigned
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/payload-sha256.txt
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-packages
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: |
            app/build/reports/
            app/build/test-results/

  remote-control-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: android-test-packages
          path: test-apks
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android without Google services
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: Nexus 7
          disable-animations: true
          script: |
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            adb install -r test-apks/debug/app-debug.apk
            adb install -r test-apks/androidTest/debug/app-debug-androidTest.apk
            mkdir -p emulator-results
            adb shell am instrument -w online.b5solucoes.slide.debug.test/androidx.test.runner.AndroidJUnitRunner | tee emulator-results/instrumentation.txt
            adb pull /sdcard/Android/data/online.b5solucoes.slide.debug/files/slide-tests emulator-results/screenshots || true
            adb logcat -d -s AndroidRuntime:E > emulator-results/crashes.txt
            python3 tools/check_instrumentation.py emulator-results/instrumentation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projector-emulator-results
          path: emulator-results/
